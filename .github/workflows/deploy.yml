name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Calcula SITE_URL y BASE_PATH a partir del repositorio.
      # No hay que configurar nada a mano.
      - name: Calcular SITE_URL y BASE_PATH
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          REPO_LC=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')

          if [ -f public/CNAME ]; then
            # Dominio propio: la web vive en la raiz del dominio
            DOMAIN=$(tr -d '[:space:]' < public/CNAME)
            SITE_URL="https://$DOMAIN"
            BASE_PATH=""
          elif [ "$REPO_LC" = "$OWNER.github.io" ]; then
            # Repo de usuario: la web vive en la raiz
            SITE_URL="https://$OWNER.github.io"
            BASE_PATH=""
          else
            # Repo de proyecto: la web vive en /nombre-del-repo
            SITE_URL="https://$OWNER.github.io"
            BASE_PATH="/$REPO"
          fi

          echo "SITE_URL=$SITE_URL"   >> "$GITHUB_ENV"
          echo "BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "::notice title=URL del sitio::$SITE_URL$BASE_PATH/sorpresa"

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
